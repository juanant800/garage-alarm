name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Usar el zip mas reciente
        run: |
          LATEST=$(git log -1 --format= --name-only --diff-filter=AM -- '*.zip' | head -n 1)
          echo "Zip mas reciente: $LATEST"
          rm -rf GarageAlarm
          unzip -q -o "$LATEST"
          if [ -d GarageAlarm ]; then echo "PROJECT_DIR=GarageAlarm" >> "$GITHUB_ENV"; else echo "PROJECT_DIR=." >> "$GITHUB_ENV"; fi
          VER=$(grep -oP 'versionName = "\K[^"]+' GarageAlarm/app/build.gradle.kts || true)
          echo "Version dentro del zip: $VER"
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          echo "Permisos de alarma exacta en el manifest: $(grep -c EXACT_ALARM GarageAlarm/app/src/main/AndroidManifest.xml || true)"

      - name: Corregir codigo y anadir sonidos
        run: |
          cd "$PROJECT_DIR"
          sed -i 's/fun setDefaultCar(id: String)/fun chooseCar(id: String)/' app/src/main/java/com/garagealarm/AlarmViewModel.kt
          sed -i 's/vm\.setDefaultCar(/vm.chooseCar(/' app/src/main/java/com/garagealarm/Screens.kt
          mkdir -p app/src/main/res/raw
          cp "$GITHUB_WORKSPACE"/car_*_sample.* app/src/main/res/raw/ 2>/dev/null || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" GarageAlarm.apk
          gh release create "v${VERSION}-${{ github.run_number }}" GarageAlarm.apk --title "Garage Alarm v${VERSION} (compilacion ${{ github.run_number }})" --notes "APK listo para instalar. Version ${VERSION}"
